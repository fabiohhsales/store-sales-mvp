[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "ffmpeg-full"]

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit --progress=false"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=4096 npm run build"]

[variables]
NEXT_PUBLIC_APP_URL = "https://painel.chatsales.com.br"

[start]
cmd = "npm run start"
